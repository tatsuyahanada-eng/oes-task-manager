<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" role="img" aria-label="WELSYS">
  <defs>
    <linearGradient id="wl-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5fe3c0"/>
      <stop offset="45%"  stop-color="#3fc9d6"/>
      <stop offset="100%" stop-color="#2f7fe0"/>
    </linearGradient>
  </defs>

  <!-- 左のエンブレム: 2つの円が重なったマーク -->
  <g fill="none" stroke="url(#wl-ring)" stroke-width="3.4">
    <circle cx="30" cy="32" r="17"/>
    <circle cx="52" cy="32" r="17"/>
    <!-- 経線・緯線 -->
    <ellipse cx="30" cy="32" rx="7.5" ry="17"/>
    <ellipse cx="52" cy="32" rx="7.5" ry="17"/>
    <path d="M13.5 25.5h33M13.5 38.5h33" stroke-width="2.6"/>
  </g>

  <!-- ワードマーク -->
  <text x="84" y="45"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="800" letter-spacing="2.5"
        fill="#ffffff">WELSYS</text>
  <circle cx="252" cy="41" r="5" fill="#3b82f6"/>
</svg>
